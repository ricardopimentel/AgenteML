<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-card: rgba(30, 41, 59, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 320px;
            margin: 0;
            padding: 16px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .header h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin: 0 0 16px 0;
            line-height: 1.35;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            height: 70px;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.8rem;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            border-color: #00f2fe;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.2);
        }

        .btn:hover {
            opacity: 0.95;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .status-msg {
            font-size: 0.75rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .status-success {
            color: #10b981;
        }

        .status-info {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>AgenteML Helper</h3>
    </div>
    <p class="desc">Gere seu anúncio de afiliado instantaneamente. Se você estiver na página do produto, o link será capturado de forma automática.</p>
    
    <div class="form-group">
        <label for="affiliate-url">Link de Afiliado (meli.la ou completo)</label>
        <textarea id="affiliate-url" placeholder="https://meli.la/XXXX ou cole o link de afiliado do Mercado Livre..."></textarea>
    </div>

    <button id="btn-generate" class="btn">Gerar Anúncio no Painel</button>
    <div id="status" class="status-msg"></div>

    <script src="popup.js"></script>
</body>
</html>
